<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Moonky Island</title>
<style>
  :root {
    --orange: #D97757;
    --orange-survol: #E3876A;
    --orange-clair: #F0A585;
    --orange-fond: rgba(217, 119, 87, 0.17);
    --orange-trait: rgba(217, 119, 87, 0.8);
    --blanc: rgba(255, 255, 255, 0.95);
    --gris: rgba(235, 235, 245, 0.6);
    --gris-pale: rgba(235, 235, 245, 0.36);
    --remplissage: rgba(118, 118, 128, 0.16);
    --remplissage-survol: rgba(118, 118, 128, 0.25);
    --affichage: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --lecture: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --ressort-ui: cubic-bezier(0.3, 1.5, 0.5, 1);
    --sortie: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font: 14px/1.4 var(--lecture); color: var(--blanc); user-select: none; cursor: default;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; outline: none; }
  button:disabled { cursor: default; }
  svg { display: block; flex: none; }
  [hidden] { display: none !important; }

  /* ---------- l'île ---------- */
  #ile {
    position: absolute; left: 50%; top: -60px; translate: -50% 0;
    width: 120px; height: 30px; border-radius: 15px;
    background: #000; overflow: hidden; overflow: clip; isolation: isolate;
    transition: scale 0.32s var(--ressort-ui);
  }
  #ile::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.13); transition: box-shadow 0.25s;
  }
  #ile[data-mode="compact"] { cursor: pointer; }
  #ile[data-mode="compact"]:hover::after { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24); }
  #ile[data-mode="compact"]:active { scale: 0.965; }

  .couche {
    position: absolute; top: 0; left: 50%; translate: -50% 0;
    opacity: 0; visibility: hidden; filter: blur(5px);
    transition: opacity 0.13s ease-in, filter 0.13s ease-in, visibility 0s linear 0.13s;
  }
  #ile[data-mode="compact"] .compact,
  #ile[data-mode="fin"] .final {
    opacity: 1; visibility: visible; filter: blur(0);
    transition: opacity 0.34s var(--sortie) 0.11s, filter 0.34s var(--sortie) 0.11s, visibility 0s;
  }
  #ile[data-mode="etendu"] .etendu { opacity: 1; visibility: visible; filter: none; transition: none; }

  /* ---------- étincelle ---------- */
  .etincelle { color: var(--orange); display: grid; place-items: center; flex: none; }
  .etincelle svg { transition: rotate 0.6s var(--ressort-ui); }
  .compact .etincelle svg { animation: respire 3.4s ease-in-out infinite; }
  #ile[data-mode="compact"]:hover .compact .etincelle svg { rotate: 36deg; }
  @keyframes respire {
    0%, 100% { transform: scale(0.84); opacity: 0.78; }
    50% { transform: scale(1); opacity: 1; }
  }

  /* ---------- pastille ---------- */
  .compact {
    height: 44px; width: max-content; display: flex; align-items: center; gap: 10px;
    padding: 0 9px 0 12px; white-space: nowrap;
  }
  .compact .etincelle { width: 20px; height: 20px; }
  .c-titre {
    font: 600 13.5px/1.1 var(--affichage); color: var(--blanc); letter-spacing: -0.005em;
    max-width: 260px; overflow: hidden; text-overflow: ellipsis; padding-right: 2px;
  }
  .badge {
    width: 26px; height: 26px; border-radius: 13px; background: var(--orange); color: #fff;
    display: grid; place-items: center; font: 700 12.5px/1 var(--affichage);
    transition: scale 0.35s var(--ressort-ui);
  }
  .badge svg { grid-area: 1 / 1; }
  #ile[data-mode="compact"]:hover .badge { scale: 1.08; }

  /* ---------- panneau ---------- */
  .etendu { width: 600px; height: 100%; display: flex; flex-direction: column; }
  .etendu > * {
    opacity: 0; transform: translateY(-6px) scale(0.985); filter: blur(4px);
    transition: opacity 0.12s ease-in, transform 0.12s ease-in, filter 0.12s ease-in;
  }
  #ile[data-mode="etendu"] .etendu > * {
    opacity: 1; transform: none; filter: blur(0);
    transition: opacity 0.34s var(--sortie), transform 0.5s cubic-bezier(0.2, 0.9, 0.25, 1), filter 0.34s var(--sortie);
  }
  #ile[data-mode="etendu"] .etendu > header { transition-delay: 0.05s; }
  #ile[data-mode="etendu"] .etendu > .pages { transition-delay: 0.09s; }
  #ile[data-mode="etendu"] .etendu > footer { transition-delay: 0.13s; }

  header { flex: none; height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 17px; }
  header .etincelle { width: 16px; height: 16px; }
  .h-titre {
    display: inline-flex; align-items: center; gap: 5px; min-width: 0; max-width: 380px;
    padding: 6px 8px; margin-left: -4px; border-radius: 9px;
    font: 600 13px/1.1 var(--affichage); color: var(--gris); transition: color 0.15s, background 0.15s;
  }
  .h-titre span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-titre svg { opacity: 0; translate: -3px 3px; transition: opacity 0.15s, translate 0.25s var(--sortie); }
  .h-titre:not(:disabled):hover { color: #fff; background: var(--remplissage); }
  .h-titre:not(:disabled):hover svg { opacity: 0.85; translate: 0 0; }
  .espace { flex: 1; }
  .points { display: flex; align-items: center; }
  .point { width: 20px; height: 26px; display: grid; place-items: center; }
  .point::before {
    content: ""; width: 6px; height: 6px; border-radius: 3px; background: rgba(235, 235, 245, 0.24);
    transition: width 0.45s var(--ressort-ui), background 0.2s;
  }
  .point:hover::before { background: rgba(255, 255, 255, 0.6); }
  .point.repondu::before { background: rgba(217, 119, 87, 0.75); }
  .point.actuel::before { width: 16px; background: rgba(255, 255, 255, 0.92); }
  .point.actuel.repondu::before { background: var(--orange); }
  .rond {
    width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; margin-left: 2px;
    color: var(--gris); transition: background 0.15s, color 0.15s, scale 0.25s var(--ressort-ui);
  }
  .rond:hover { background: var(--remplissage-survol); color: #fff; }
  .rond:active { scale: 0.9; }

  /* clip et non hidden : un conteneur hidden défile quand même sous un focus (champ focalisé pendant que le
     panneau grandit), et le décalage restait ensuite (haut de la question coupé, vide en bas) */
  .pages { flex: 1; min-height: 0; position: relative; overflow: hidden; overflow: clip; }
  .page {
    position: absolute; top: 0; left: 0; right: 0; padding: 2px 18px 18px;
    max-height: var(--page-max, 640px); overflow-y: auto; overscroll-behavior: contain;
    visibility: hidden;
  }
  .page.visible { visibility: visible; }
  .page::-webkit-scrollbar { width: 8px; }
  .page::-webkit-scrollbar-thumb { background: rgba(118, 118, 128, 0.4); border-radius: 8px; border: 2px solid #000; }
  .page::-webkit-scrollbar-button { display: none; height: 0; }
  .q-entete { font: 600 12px/1.2 var(--affichage); color: var(--orange-clair); letter-spacing: 0.01em; margin-bottom: 7px; }
  .q-texte {
    font: 600 16px/1.38 var(--affichage); color: #fff; letter-spacing: -0.01em; margin-bottom: 14px;
    text-wrap: pretty; user-select: text; cursor: text;
  }

  .options { display: flex; flex-direction: column; gap: 6px; }
  .option {
    display: grid; grid-template-columns: 20px 1fr auto; align-items: start; column-gap: 12px;
    width: 100%; text-align: left; padding: 11px 12px 11px 13px; border-radius: 14px;
    background: var(--remplissage);
    transition: background 0.15s, box-shadow 0.2s, transform 0.25s var(--ressort-ui);
  }
  .option:hover { background: var(--remplissage-survol); }
  .option:active { transform: scale(0.985); }
  .option.choisi { background: var(--orange-fond); box-shadow: inset 0 0 0 1.25px var(--orange-trait); }
  .indic {
    width: 20px; height: 20px; margin-top: 0.5px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; box-shadow: inset 0 0 0 1.5px rgba(235, 235, 245, 0.3);
    transition: background 0.18s, box-shadow 0.18s, scale 0.4s var(--ressort-ui);
  }
  .multiple .indic { border-radius: 6px; }
  .choisi .indic { background: var(--orange); box-shadow: inset 0 0 0 1.5px var(--orange); }
  .option:active .indic { scale: 0.86; }
  .indic path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 0.12s ease-in; }
  .choisi .indic path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.26s cubic-bezier(0.3, 0.8, 0.3, 1) 0.05s; }
  .corps { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 0.5px; }
  .libelle { font: 500 14px/1.36 var(--lecture); color: var(--blanc); }
  .reco {
    display: inline-block; margin-left: 8px; padding: 2px 7px 3px; border-radius: 6px; vertical-align: 1px;
    font: 600 11px/1.1 var(--affichage); color: var(--orange-clair); background: rgba(217, 119, 87, 0.18);
  }
  .desc { font: 400 12.5px/1.42 var(--lecture); color: rgba(235, 235, 245, 0.55); }
  kbd {
    min-width: 18px; height: 18px; padding: 0 5px; margin-top: 1px; border-radius: 5px; text-align: center;
    font: 600 11px/18px var(--affichage); color: rgba(235, 235, 245, 0.55); background: rgba(118, 118, 128, 0.24);
    opacity: 0; transition: opacity 0.15s;
  }
  body.clavier kbd { opacity: 1; }
  body.clavier .option:focus-visible, body.clavier button:focus-visible { outline: 2px solid var(--orange-trait); outline-offset: 2px; }

  /* ---------- nuance et dictée ---------- */
  .nuance {
    position: relative; display: flex; align-items: flex-end; gap: 6px; margin-top: 10px;
    padding: 5px 5px 5px 14px; border-radius: 14px; background: rgba(118, 118, 128, 0.13);
    transition: box-shadow 0.2s, background 0.2s;
  }
  /* coins continus, comme sur iOS, là où le moteur les connaît */
  @supports (corner-shape: squircle) {
    .option, .nuance { corner-shape: squircle; border-radius: 22px; }
  }
  .nuance.actif { box-shadow: inset 0 0 0 1px rgba(235, 235, 245, 0.22); }
  .nuance.rempli { box-shadow: inset 0 0 0 1.25px var(--orange-trait); }
  .nuance.sans-micro { padding-right: 14px; }
  textarea {
    flex: 1; min-width: 0; height: 32px; max-height: 124px; padding: 6px 0; resize: none; border: 0; outline: 0;
    background: transparent; color: #fff; caret-color: var(--orange); font: 400 14px/20px var(--lecture);
  }
  textarea::placeholder { color: var(--gris-pale); }
  textarea::-webkit-scrollbar { width: 0; }
  .micro {
    flex: none; width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; color: var(--gris);
    transition: background 0.2s, color 0.2s, scale 0.3s var(--ressort-ui);
  }
  .micro:hover { background: var(--remplissage-survol); color: #fff; }
  .micro:active { scale: 0.88; }
  .micro svg { grid-area: 1 / 1; }
  .i-stop, .i-roue { display: none; }
  .onde { display: none; align-items: center; gap: 2.5px; height: 30px; padding-right: 3px; }
  .onde i { display: block; width: 3px; height: 16px; border-radius: 2px; background: var(--orange); transform: scaleY(0.2); transition: transform 0.09s linear; }
  .scintille {
    display: none; position: absolute; left: 14px; top: 11px; pointer-events: none;
    font: 500 14px/20px var(--lecture); color: transparent;
    background: linear-gradient(90deg, rgba(235, 235, 245, 0.28) 0%, #fff 50%, rgba(235, 235, 245, 0.28) 100%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text;
    animation: scintille 1.4s linear infinite;
  }
  .nuance[data-etat="ecoute"] { box-shadow: inset 0 0 0 1.5px var(--orange), 0 0 0 4px rgba(217, 119, 87, 0.16); }
  .nuance[data-etat="ecoute"] .onde { display: flex; }
  .nuance[data-etat="ecoute"] .micro { background: var(--orange); color: #fff; animation: pouls 1.6s ease-out infinite; }
  .nuance[data-etat="ecoute"] .i-micro { display: none; }
  .nuance[data-etat="ecoute"] .i-stop { display: block; }
  .nuance[data-etat="transcrit"] .i-micro { display: none; }
  .nuance[data-etat="transcrit"] .i-roue { display: block; animation: tourne 0.9s linear infinite; }
  .nuance[data-etat="transcrit"] .micro { color: var(--orange); background: none; cursor: default; }
  .nuance[data-etat="transcrit"] .scintille { display: block; }
  .nuance[data-etat="transcrit"] textarea { color: transparent; }
  .nuance[data-etat="transcrit"] textarea::placeholder { color: transparent; }
  .note { font: 400 12px/1.4 var(--lecture); color: rgba(235, 235, 245, 0.55); margin: 7px 4px 0; }
  .note:empty { display: none; }
  .note.erreur { color: #FF8070; }

  /* ---------- pied ---------- */
  footer {
    flex: none; height: 58px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 9px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
  }
  .discret {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px;
    font: 500 13px/1 var(--lecture); color: var(--gris); transition: background 0.15s, color 0.15s;
  }
  .discret:hover { background: var(--remplissage); color: #fff; }
  .principal {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 18px; border-radius: 17px;
    font: 600 13.5px/1 var(--affichage); color: #fff; background: var(--orange);
    transition: background 0.22s, color 0.22s, scale 0.3s var(--ressort-ui);
  }
  .principal:hover:not(:disabled) { background: var(--orange-survol); }
  .principal:active:not(:disabled) { scale: 0.95; }
  .principal:disabled { background: rgba(118, 118, 128, 0.22); color: rgba(235, 235, 245, 0.32); }
  .principal .i-entree { display: none; opacity: 0.75; margin-right: -4px; }
  body.clavier .principal:not(:disabled) .i-entree { display: block; }

  /* ---------- fin ---------- */
  .final {
    height: 44px; width: max-content; display: flex; align-items: center; gap: 9px; padding: 0 18px 0 11px;
    font: 600 13.5px/1 var(--affichage); color: #fff; white-space: nowrap;
  }
  .f-icone { width: 22px; height: 22px; border-radius: 11px; background: var(--orange); display: grid; place-items: center; color: #fff; }
  .f-icone path { stroke-dasharray: 1; stroke-dashoffset: 1; }
  #ile[data-mode="fin"] .f-icone { animation: pop 0.55s var(--ressort-ui) 0.1s both; }
  #ile[data-mode="fin"] .f-icone path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.32s cubic-bezier(0.3, 0.8, 0.3, 1) 0.24s; }

  @keyframes tourne { to { rotate: 360deg; } }
  @keyframes scintille { from { background-position: 110% 0; } to { background-position: -110% 0; } }
  @keyframes pouls {
    0% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0.5); }
    80%, 100% { box-shadow: 0 0 0 8px rgba(217, 119, 87, 0); }
  }
  @keyframes pop { from { scale: 0.4; opacity: 0; } to { scale: 1; opacity: 1; } }
  @keyframes secoue {
    0%, 100% { translate: 0; } 20% { translate: -5px; } 40% { translate: 4px; } 60% { translate: -3px; } 80% { translate: 2px; }
  }
  .secoue { animation: secoue 0.36s ease-in-out; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01s !important; animation-duration: 0.01s !important; }
  }
</style>
</head>
<body>
  <div id="ile" data-mode="arrivee" role="dialog" aria-live="polite">
    <div class="couche compact" id="compact">
      <span class="etincelle" id="c-etincelle"></span>
      <span class="c-titre" id="c-titre"></span>
      <span class="badge" id="badge"></span>
    </div>

    <div class="couche etendu" id="etendu">
      <header>
        <span class="etincelle" id="h-etincelle"></span>
        <button class="h-titre" id="h-titre" title="Ouvrir la discussion dans Claude">
          <span></span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
        </button>
        <span class="espace"></span>
        <div class="points" id="points"></div>
        <button class="rond" id="replier" title="Réduire (Échap)" aria-label="Réduire">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14.5 6-6 6 6"/></svg>
        </button>
      </header>
      <div class="pages" id="pages"></div>
      <footer>
        <button class="discret" id="dans-claude">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
          <span id="dc-texte">Répondre dans Claude</span>
        </button>
        <span class="espace"></span>
        <button class="principal" id="principal" disabled>
          <span id="p-texte">Envoyer</span>
          <svg class="i-entree" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10 5 14l4 4"/><path d="M5 14h10a4 4 0 0 0 4-4V6"/></svg>
        </button>
      </footer>
    </div>

    <div class="couche final" id="final">
      <span class="f-icone" id="f-icone"></span>
      <span id="f-texte"></span>
    </div>
  </div>

<script>
  const D = __DONNEES__;

  // textes de l'interface, en anglais si la langue choisie par l'îlot (Windows ou réglage « langue ») n'est pas le français
  const EN = D.langue === 'en';
  const T = EN ? {
    ouvrir: 'Open the chat in Claude', reduire: 'Collapse (Esc)', reduireCourt: 'Collapse', dansClaude: 'Answer in Claude',
    envoyer: 'Send', suivant: 'Next', envoye: 'Sent', ouvert: 'Opened in Claude', reco: 'Recommended',
    question: (n) => `Question ${n}`, autre: 'Other answer or detail', transcription: 'Transcribing…',
    dicter: 'Dictate', arreter: 'Stop and transcribe', ecoute: 'Listening… click the square to stop',
    lent: 'Transcription is slower than usual. Press Esc to stop it.', impossible: 'Dictation unavailable: ',
    rate: 'Dictation failed: ', muet: 'no response', rien: 'I didn’t hear anything. Try again a little closer to the mic.',
  } : {
    ouvrir: 'Ouvrir la discussion dans Claude', reduire: 'Réduire (Échap)', reduireCourt: 'Réduire',
    dansClaude: 'Répondre dans Claude', envoyer: 'Envoyer', suivant: 'Suivant', envoye: 'Envoyé',
    ouvert: 'Ouvert dans Claude', reco: 'Recommandé', question: (n) => `Question ${n}`,
    autre: 'Autre réponse ou précision', transcription: 'Transcription…', dicter: 'Dicter',
    arreter: 'Arrêter et transcrire', ecoute: 'Je t’écoute… clique sur le carré pour arrêter',
    lent: 'Transcription plus lente que d’habitude. Échap pour l’arrêter.', impossible: 'Dictée impossible : ',
    rate: 'La dictée n’a pas marché : ', muet: 'pas de réponse',
    rien: 'Je n’ai rien entendu. Réessaie un peu plus près du micro.',
  };

  // ---------- outils ----------
  const $ = (s, r = document) => r.querySelector(s);
  const ile = $('#ile');
  const reduit = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const attendre = (ms) => new Promise((r) => setTimeout(r, ms));
  function appel(nom, ...args) {
    try {
      const f = window.pywebview && window.pywebview.api && window.pywebview.api[nom];
      return f ? Promise.resolve(f(...args)).catch(() => null) : Promise.resolve(null);
    } catch (e) { return Promise.resolve(null); }
  }
  // typographie française : espaces insécables et apostrophe courbe, à l'affichage seulement. Sans effet sur un
  // texte anglais, qui n'a pas d'espace avant ? ! : ; (les questions sont dans la langue de la discussion, pas de Windows)
  const fr = (t) => String(t)
    .replace(/ ([?!;%])/g, ' $1').replace(/ ([:»])/g, ' $1').replace(/« /g, '« ').replace(/'/g, '’');
  function el(balise, classe, texte) {
    const e = document.createElement(balise);
    if (classe) e.className = classe;
    if (texte !== undefined) e.textContent = fr(texte);
    return e;
  }

  // ressort amorti échantillonné en easing linear() : réponse en secondes, amortissement entre 0 et 1
  function ressort(reponse, amorti) {
    if (reduit) return { duration: 1, easing: 'linear' };
    const w0 = 2 * Math.PI / reponse, z = amorti, wd = w0 * Math.sqrt(1 - z * z);
    const x = (t) => 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
    let T = 0;
    for (let t = 0; t < 3; t += 0.004) if (Math.abs(1 - x(t)) > 0.002) T = t;
    const pts = [];
    for (let i = 0; i <= 60; i++) pts.push(+x(T * i / 60).toFixed(4));
    return { duration: Math.round(T * 1000), easing: 'linear(' + pts.join(', ') + ')' };
  }
  const R_ARRIVEE = ressort(0.62, 0.72);
  const R_OUVRIR = ressort(0.52, 0.8);
  const R_FERMER = ressort(0.44, 0.88);
  const R_PAGE = ressort(0.42, 0.86);

  // ---------- icônes ----------
  // Logo Claude officiel, repris tel quel de l'appli Claude (ion-dist.asar, assets/v1/cd02a42d9-Vq_H3mgS.svg).

    const reponses = {};

    appel('dans_claude');

  // ---------- dictée ----------
  function note(i, texte, erreur) {

    n.textContent = texte ? fr(texte) : '';

    e.classList.remove('secoue');
    void e.offsetWidth;
    e.classList.add('secoue');

  function remettre(v) {
    v.micro.disabled = false;
    v.nuance.dataset.etat = '';
    v.micro.title = T.dicter;
    v.champ.placeholder = PLACEHOLDER;
  }

  // trois phases : ouverture du micro, écoute, transcription. Échap, « Répondre dans Claude » et le chevron
  // arrêtent la dictée à chacune ; le jeton dit à l'îlot quelle transcription lâcher, un résultat tardif est ignoré
  async function basculerDictee(i) {
    const v = vues[i];

    if (!dictee) {

      const d = { i, phase: 'ouverture', jeton: ++seqDictee, minuterie: null };
      dictee = d;
      v.micro.disabled = true;
      ouvertureEnAttente = true;
      const r = await appel('dictee_debut', d.jeton);
      ouvertureEnAttente = false;
      if (dictee !== d) {  // arrêtée pendant l'ouverture : on referme le micro qui vient de s'ouvrir
        if (r === 'ok') appel('dictee_annuler');
        v.micro.disabled = false;
        return;
      }
      v.micro.disabled = false;
      if (r !== 'ok') { dictee = null; note(i, T.impossible + (r || T.muet), true); secouer(v.nuance); return; }
      d.phase = 'ecoute';
      v.nuance.dataset.etat = 'ecoute';
      v.micro.title = T.arreter;
      v.champ.placeholder = T.ecoute;
      note(i, '');
      suivreNiveau(i);
      return;
    }
    const d = dictee;
    if (d.phase !== 'ecoute') return;
    d.phase = 'transcrit';
    v.nuance.dataset.etat = 'transcrit';
    v.micro.disabled = true;
    d.minuterie = setTimeout(() => {
      if (dictee === d) note(i, T.lent);
    }, 8000);
    const r = await appel('dictee_fin', d.jeton);
    clearTimeout(d.minuterie);
    if (dictee !== d) return;  // arrêtée entre-temps : le résultat ne sert plus
    dictee = null;
    remettre(v);
    note(i, '');
    if (r && r.abandon) return;
    if (!r || r.erreur) { note(i, T.rate + ((r && r.erreur) || T.muet), true); secouer(v.nuance); return; }
    const texte = (r.texte || '').trim();
    if (!texte) { note(i, T.rien); return; }
    ecrire(i, texte);
  }

  function annulerDictee() {
    const d = dictee;
    if (!d) return;
    dictee = null;
    clearTimeout(d.minuterie);
    if (d.phase === 'transcrit') appel('dictee_abandonner', d.jeton);
    else appel('dictee_annuler');
    remettre(vues[d.i]);
    if (d.phase === 'ouverture') vues[d.i].micro.disabled = true;  // rendu quand l'ouverture revient
    note(d.i, '');
  }

  // le texte dicté s'écrit en quelques images, comme s'il arrivait
  function ecrire(i, texte) {
    const champ = vues[i].champ;
    const base = champ.value.trim() ? champ.value.trim() + ' ' : '';
    const duree = reduit ? 0 : Math.min(420, texte.length * 9);
    const t0 = performance.now();
    const pas = () => {
      const k = duree ? Math.min(1, (performance.now() - t0) / duree) : 1;
      champ.value = base + texte.slice(0, Math.round(texte.length * k));
      champ.dispatchEvent(new Event('input'));
      if (k < 1) requestAnimationFrame(pas);
      else { champ.focus(); champ.setSelectionRange(champ.value.length, champ.value.length); }
    };
    pas();
  }

  function suivreNiveau(i) {
    const barres = vues[i].barres;
    const poids = [0.55, 0.8, 1, 0.8, 0.55];
    const lisse = [0, 0, 0, 0, 0];
    let max = 1;
    const tic = async () => {
      if (!dictee || dictee.i !== i || dictee.phase !== 'ecoute') {
        barres.forEach((b) => { b.style.transform = ''; });
        return;
      }
      let v = await appel('niveau');
      let n;
      if (typeof v === 'number' && v >= 0) {
        max = Math.max(v, max * 0.985, 1);
        n = Math.min(1, v / max);
      } else {
        n = 0.35 + 0.3 * Math.sin(performance.now() / 170);
      }
      barres.forEach((b, k) => {
        const cible = n * poids[k] * (0.72 + 0.28 * Math.random());
        lisse[k] = lisse[k] * 0.45 + cible * 0.55;
        b.style.transform = `scaleY(${(0.18 + 0.82 * lisse[k]).toFixed(3)})`;
      });
      setTimeout(tic, 70);
    };
    tic();
  }

  // ---------- clavier ----------
  function clavier(oui) { document.body.classList.toggle('clavier', oui); }
  window.addEventListener('pointermove', (e) => { if (Math.abs(e.movementX) + Math.abs(e.movementY) > 1) clavier(false); });

  document.addEventListener('keydown', (e) => {
    if (mode !== 'etendu') return;
    const champ = vues[page].champ;
    const dansChamp = e.target === champ || (e.target && e.target.tagName === 'TEXTAREA');
    if (e.key === 'Escape') {
      e.preventDefault();
      if (dictee) annulerDictee(); else replier(true);
      return;
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); envoyer(); return; }
    if (e.key === 'Enter' && !e.shiftKey && (dansChamp || e.target.tagName !== 'BUTTON')) {
      e.preventDefault();
      actionPrincipale();
      return;
    }
    if (dansChamp || e.ctrlKey || e.altKey || e.metaKey) return;
    // touche physique et non caractère : sur un clavier AZERTY, la touche 1 donne « & » et la touche 2 « é »
    const touche = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');
    const n = touche ? Number(touche[1]) : (/^[1-9]$/.test(e.key) ? Number(e.key) : 0);
    if (n) {
      const j = n - 1;
      if (j < Q[page].options.length) {
        e.preventDefault();
        clavier(true);
        vues[page].boutons[j].focus({ preventScroll: false });
        choisir(page, j, 'clavier');
      }
      return;
    }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      e.preventDefault();
      clavier(true);
      allerA(page + (e.key === 'ArrowRight' ? 1 : -1));
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Tab') {
      clavier(true);
      if (e.key === 'Tab') return;
      e.preventDefault();
      const liste = vues[page].boutons;
      const k = liste.indexOf(document.activeElement);
      const suivant = e.key === 'ArrowDown' ? (k + 1) % liste.length : (k <= 0 ? liste.length - 1 : k - 1);
      liste[suivant].focus();
      return;
    }
    // une lettre tapée n'importe où va dans le champ de la question affichée
    if (e.key.length === 1 && e.key !== ' ') champ.focus();
  });

  // ---------- branchements ----------
  ile.addEventListener('click', () => { if (mode === 'compact') deplier(); });
  $('#replier').onclick = (e) => { e.stopPropagation(); if (dictee) annulerDictee(); replier(true); };
  $('#principal').onclick = actionPrincipale;
  $('#dans-claude').onclick = versClaude;
  $('#h-titre').onclick = () => appel('ouvrir');
  window.addEventListener('blur', () => setTimeout(() => { if (!document.hasFocus()) perteFocus(); }, 60));
  document.addEventListener('contextmenu', (e) => { if (e.target.tagName !== 'TEXTAREA') e.preventDefault(); });

  // accès pour les essais automatiques
  window.ilot = {
    deplier, replier, choisir, allerA, envoyer, versClaude, perteFocus, changerRang, basculerDictee, annulerDictee,
    etat: () => ({
      mode, page, complet: complet(), reponses: Q.map((_, i) => reponse(i)),
      dictee: dictee && { i: dictee.i, phase: dictee.phase },
    }),
    cadre: () => { const r = ile.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height, dpr: window.devicePixelRatio || 1 }; },
    async testAuto() {
      while (mode !== 'compact') await attendre(50);
      await deplier();
      Q.forEach((q) => choisir(q.i, 0, 'auto'));
      const c = vues[Q.length - 1].champ;
      c.value = 'nuance de test';
      c.dispatchEvent(new Event('input'));
      await attendre(400);
      envoyer();
    },
  };

  let demarre = false;
  function demarrer() {
    if (demarre) return;
    demarre = true;
    construire();
    requestAnimationFrame(() => arrivee());
  }
  window.addEventListener('pywebviewready', demarrer);
  if (window.pywebview && window.pywebview.api && window.pywebview.api.zone) demarrer();
</script>
</body>
</html>
